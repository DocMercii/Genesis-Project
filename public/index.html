<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101b14">
  <title>Genesis Project</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header>
      <div><h1>GENESIS</h1><small id="era">Year 0 · Day 1</small></div>
      <div class="metrics"><span>Humanity <b id="population">2</b></span><span id="clock">06:00</span></div>
    </header>
    <section class="world-wrap">
      <canvas id="world" width="1000" height="700" aria-label="The Genesis world"></canvas>
      <div class="speedbar">
        <button data-speed="pause">Ⅱ</button><button data-speed="1" class="active">1×</button><button data-speed="4">4×</button><button data-speed="16">16×</button>
      </div>
      <div class="hint">Tap a human to observe them</div>
    </section>
    <aside id="panel" class="panel hidden">
      <button id="closePanel" class="close">×</button>
      <div class="person-title"><div id="portrait" class="portrait">E</div><div><h2 id="personName"></h2><p id="personMeta"></p></div></div>
      <blockquote id="thought"></blockquote>
      <div id="needs" class="needs"></div>
      <div class="inventory"><b>Possessions</b><span id="inventory"></span></div>
      <details><summary>Memories</summary><div id="memories"></div></details>
      <div class="creator"><label for="divineMessage">Speak as the Creator</label><textarea id="divineMessage" maxlength="500" placeholder="Your words will become a permanent memory..."></textarea><button id="speak">Speak</button></div>
    </aside>
    <section class="chronicle"><h2>Chronicle</h2><div id="history"></div></section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
